name: Sync to Global Project

# Todo lo que pasa con issues y PRs se refleja en el board Convolution Ops:
#   issue abierta / reabierta      -> Todo
#   issue asignada                 -> In Progress
#   issue con label "backlog"      -> Backlog
#   issue cerrada                  -> Done
#   PR abierto / listo / reabierto -> In Progress
#   PR pasado a draft              -> In Progress
#   PR cerrado o mergeado          -> Done
#   sub-issue cambia               -> el padre (epic) pasa a In Progress,
#                                     y a Done cuando todas están cerradas

on:
  issues:
    types: [opened, reopened, closed, assigned, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

concurrency:
  group: project-sync-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Agregar al Project V2 y actualizar Status
        env:
          GH_TOKEN: ${{ secrets.ORG_PROJECT_TOKEN }}
          OWNER: Convolution-dev
          PROJECT_NUMBER: "2"
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ITEM_URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
          MERGED: ${{ github.event.pull_request.merged }}
          LABEL: ${{ github.event.label.name }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          case "$EVENT:$ACTION" in
            issues:opened|issues:reopened)          STATUS="Todo" ;;
            issues:assigned)                        STATUS="In Progress" ;;
            issues:closed)                          STATUS="Done" ;;
            issues:labeled)
              [[ "$LABEL" == "backlog" ]] && STATUS="Backlog" || STATUS="" ;;
            issues:unlabeled)
              [[ "$LABEL" == "backlog" && "$ISSUE_STATE" == "open" ]] && STATUS="Todo" || STATUS="" ;;
            pull_request:opened|pull_request:reopened|pull_request:ready_for_review|pull_request:converted_to_draft)
              STATUS="In Progress" ;;
            pull_request:closed)                    STATUS="Done" ;;
            *)                                      STATUS="" ;;
          esac

          echo "evento=$EVENT/$ACTION url=$ITEM_URL status=${STATUS:-<sin cambio>}"

          PROJECT_ID=$(gh project view "$PROJECT_NUMBER" --owner "$OWNER" --format json --jq .id)
          FIELDS=$(gh project field-list "$PROJECT_NUMBER" --owner "$OWNER" --format json)
          FIELD_ID=$(jq -r '.fields[] | select(.name=="Status") | .id' <<<"$FIELDS")

          # set_status <url> <status>: agrega el item (idempotente) y mueve la columna
          set_status() {
            local url="$1" status="$2" item_id option_id
            item_id=$(gh project item-add "$PROJECT_NUMBER" --owner "$OWNER" --url "$url" --format json --jq .id)
            [[ -z "$status" ]] && { echo "  $url agregado, sin cambio de Status"; return 0; }
            option_id=$(jq -r --arg s "$status" '.fields[] | select(.name=="Status") | .options[] | select(.name==$s) | .id' <<<"$FIELDS")
            if [[ -z "$option_id" ]]; then
              echo "::warning::El Status '$status' no existe en el proyecto; $url agregado sin mover"; return 0
            fi
            gh project item-edit --project-id "$PROJECT_ID" --id "$item_id" \
              --field-id "$FIELD_ID" --single-select-option-id "$option_id" >/dev/null
            echo "  $url -> $status"
          }

          set_status "$ITEM_URL" "$STATUS"

          # --- Epics: si esta issue es sub-issue, sincronizar el padre ---
          [[ "$EVENT" == "issues" ]] || exit 0
          PARENT=$(gh api graphql -H 'GraphQL-Features: sub_issues' \
            -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F number="$ISSUE_NUMBER" \
            -f query='query($owner:String!,$name:String!,$number:Int!){
              repository(owner:$owner,name:$name){ issue(number:$number){
                parent { url state subIssuesSummary { total completed } } } } }' \
            --jq '.data.repository.issue.parent // empty')
          [[ -z "$PARENT" ]] && exit 0

          P_URL=$(jq -r .url <<<"$PARENT")
          P_STATE=$(jq -r .state <<<"$PARENT")
          P_TOTAL=$(jq -r .subIssuesSummary.total <<<"$PARENT")
          P_DONE=$(jq -r .subIssuesSummary.completed <<<"$PARENT")
          echo "epic: $P_URL ($P_DONE/$P_TOTAL sub-issues cerradas, $P_STATE)"

          if [[ "$P_STATE" == "CLOSED" ]]; then
            P_STATUS="Done"
          elif (( P_TOTAL > 0 && P_DONE == P_TOTAL )); then
            P_STATUS="Done"
          elif (( P_DONE > 0 )) || [[ "$STATUS" == "In Progress" ]]; then
            P_STATUS="In Progress"
          else
            P_STATUS=""   # recién empieza: la dejamos donde esté
          fi
          set_status "$P_URL" "$P_STATUS"
