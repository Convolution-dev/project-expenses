name: Sync to Global Project

# Todo lo que pasa con issues y PRs se refleja en el board Convolution Ops:
#   issue abierta / reabierta      -> Todo
#   issue asignada                 -> In Progress
#   issue con label "backlog"      -> Backlog
#   issue cerrada                  -> Done
#   PR abierto / listo / reabierto -> In Progress
#   PR pasado a draft              -> In Progress
#   PR cerrado o mergeado          -> Done
#   sub-issue cambia               -> el padre (epic) pasa a In Progress,
#                                     y a Done cuando todas están cerradas

on:
  issues:
    types: [opened, reopened, closed, assigned, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

concurrency:
  group: project-sync-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Agregar al Project V2 y actualizar Status
        env:
          GH_TOKEN: ${{ secrets.ORG_PROJECT_TOKEN }}
          PROJECT_ID: PVT_kwDOEJS8884BjmUc   # Convolution Ops (orgs/Convolution-dev/projects/2)
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ITEM_URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
          CONTENT_ID: ${{ github.event.issue.node_id || github.event.pull_request.node_id }}
          MERGED: ${{ github.event.pull_request.merged }}
          LABEL: ${{ github.event.label.name }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          case "$EVENT:$ACTION" in
            issues:opened|issues:reopened)          STATUS="Todo" ;;
            issues:assigned)                        STATUS="In Progress" ;;
            issues:closed)                          STATUS="Done" ;;
            issues:labeled)
              [[ "$LABEL" == "backlog" ]] && STATUS="Backlog" || STATUS="" ;;
            issues:unlabeled)
              [[ "$LABEL" == "backlog" && "$ISSUE_STATE" == "open" ]] && STATUS="Todo" || STATUS="" ;;
            pull_request:opened|pull_request:reopened|pull_request:ready_for_review|pull_request:converted_to_draft)
              STATUS="In Progress" ;;
            pull_request:closed)                    STATUS="Done" ;;
            *)                                      STATUS="" ;;
          esac

          echo "evento=$EVENT/$ACTION url=$ITEM_URL status=${STATUS:-<sin cambio>}"

          # Campo Status y sus opciones, por GraphQL con el ID del proyecto
          # (gh project ... --owner exige read:org; esto no).
          FIELD=$(gh api graphql -F project="$PROJECT_ID" -f query='
            query($project:ID!){ node(id:$project){ ... on ProjectV2 {
              field(name:"Status"){ ... on ProjectV2SingleSelectField { id options { id name } } } } } }' \
            --jq '.data.node.field')
          FIELD_ID=$(jq -r .id <<<"$FIELD")

          # set_status <content_node_id> <status>: agrega el item (idempotente) y mueve la columna
          set_status() {
            local content_id="$1" status="$2" item_id option_id
            item_id=$(gh api graphql -F project="$PROJECT_ID" -F content="$content_id" -f query='
              mutation($project:ID!,$content:ID!){
                addProjectV2ItemById(input:{projectId:$project,contentId:$content}){ item { id } } }' \
              --jq '.data.addProjectV2ItemById.item.id')
            [[ -z "$status" ]] && { echo "  $content_id agregado, sin cambio de Status"; return 0; }
            option_id=$(jq -r --arg s "$status" '.options[] | select(.name==$s) | .id' <<<"$FIELD")
            if [[ -z "$option_id" ]]; then
              echo "::warning::El Status '$status' no existe en el proyecto; item agregado sin mover"; return 0
            fi
            gh api graphql -F project="$PROJECT_ID" -F item="$item_id" -F field="$FIELD_ID" -f option="$option_id" -f query='
              mutation($project:ID!,$item:ID!,$field:ID!,$option:String!){
                updateProjectV2ItemFieldValue(input:{projectId:$project,itemId:$item,fieldId:$field,
                  value:{singleSelectOptionId:$option}}){ projectV2Item { id } } }' >/dev/null
            echo "  item $item_id -> $status"
          }

          set_status "$CONTENT_ID" "$STATUS"

          # --- Epics: si esta issue es sub-issue, sincronizar el padre ---
          [[ "$EVENT" == "issues" ]] || exit 0
          PARENT=$(gh api graphql -H 'GraphQL-Features: sub_issues' \
            -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F number="$ISSUE_NUMBER" \
            -f query='query($owner:String!,$name:String!,$number:Int!){
              repository(owner:$owner,name:$name){ issue(number:$number){
                parent { id url state subIssuesSummary { total completed } } } } }' \
            --jq '.data.repository.issue.parent // empty')
          [[ -z "$PARENT" ]] && exit 0

          P_ID=$(jq -r .id <<<"$PARENT")
          P_URL=$(jq -r .url <<<"$PARENT")
          P_STATE=$(jq -r .state <<<"$PARENT")
          P_TOTAL=$(jq -r .subIssuesSummary.total <<<"$PARENT")
          P_DONE=$(jq -r .subIssuesSummary.completed <<<"$PARENT")
          echo "epic: $P_URL ($P_DONE/$P_TOTAL sub-issues cerradas, $P_STATE)"

          if [[ "$P_STATE" == "CLOSED" ]]; then
            P_STATUS="Done"
          elif (( P_TOTAL > 0 && P_DONE == P_TOTAL )); then
            P_STATUS="Done"
          elif (( P_DONE > 0 )) || [[ "$STATUS" == "In Progress" ]]; then
            P_STATUS="In Progress"
          else
            P_STATUS=""   # recién empieza: la dejamos donde esté
          fi
          set_status "$P_ID" "$P_STATUS"
